name: deploy

# 코드를 밀면 배포판이 갱신된다. 사용자가 말한 "GitHub 에 올리고 폰에서 받는" 이
# 실제로 도는 자리다 — 폰에는 홈 화면에 추가로 들어가고, 내용은 여기서 갱신된다.
#
# **비밀값은 저장소에 없다.** `fly secrets` 로만 올린다(토스 키·접속 토큰·VAPID).
# 여기 필요한 건 배포 권한 하나뿐이다.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/deploy.yml"
      # 학습 기록도 이미지에 들어간다(Dockerfile 참조). 이게 빠지면 밤새 배운
      # 것과 아침 추천이 배포판에 영영 안 닿는다.
      - "learning/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 토큰이 없으면 조용히 건너뛴다. 배포를 안 쓰는 사람이 클론해도 CI 가 빨개지지 않는다.
    if: ${{ github.repository_owner != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 배포 토큰이 있나
        id: check
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            # **초록불로 조용히 끝내지 않는다.** 토큰이 없으면 아무것도 안 배포하는데
            # 실행은 성공으로 남아, 몇 달째 배포가 안 되고 있어도 눈에 안 띈다.
            # 실제로 그랬다 — 실행 요약에 적어 최소한 보이게 한다.
            echo "::warning::FLY_API_TOKEN 이 없어 아무것도 배포하지 않았다"
            {
              echo "### 배포 안 함"
              echo
              echo "\`FLY_API_TOKEN\` 시크릿이 없어 이 실행은 아무것도 배포하지 않았다."
              echo "초록불이지만 배포판은 그대로다 — 몇 달째 안 되고 있어도 눈에 안 띄어서"
              echo "여기에 적어 둔다."
              echo
              echo "고치는 법 (토큰이 사람 손에서 바로 시크릿으로 들어간다):"
              echo
              echo '```'
              echo "fly tokens create deploy -x 8760h | gh secret set FLY_API_TOKEN"
              echo '```'
              echo
              echo "flyctl 이 없으면 먼저 \`iwr https://fly.io/install.ps1 -useb | iex\` 로 받고"
              echo "\`fly auth login\` 을 한다. 앱이 아직 없으면 \`fly.toml\` 머리말의 순서를"
              echo "따른다 — 고정 IPv4 를 받아 토스 콘솔 허용목록에 넣는 단계가 거기 있다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.ready == 'yes'

      - run: flyctl deploy --remote-only
        if: steps.check.outputs.ready == 'yes'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
