# Fly.io 배포. 고정 IPv4 를 받아 **토스 허용 IP 에 등록**하는 게 이 파일의 요점이다.
#
#   fly launch --no-deploy
#   fly ips allocate-v4                 ← 이 주소를 토스 콘솔 허용목록에 넣는다
#   fly volumes create data --size 1
#   fly secrets set MARKET_LENS_TOKEN=... TOSS_CLIENT_ID=... TOSS_CLIENT_SECRET=... \
#                  VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... VAPID_CONTACT=mailto:...
#   fly deploy

app = "market-lens"
primary_region = "nrt"          # 도쿄. 토스·업비트에 제일 가깝다

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # **0 으로 두지 않는다.** 인스턴스가 자면 감시 루프가 멈춰 알림이 안 나간다.
  auto_stop_machines = false
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"          # 토큰 없이 열려 있는 유일한 경로

[[mounts]]
  source = "data"
  destination = "/data"         # 알림 규칙·학습 기록이 재배포에도 남는다

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
