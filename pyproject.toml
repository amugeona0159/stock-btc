[project]
name = "market-lens"
version = "0.1.0"
description = "차트를 읽고 이후 양상을 분석·예측하는 엔진"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
ml = ["scikit-learn>=1.5", "lightgbm>=4.5", "pyarrow>=17.0"]
# 자연어 질문 해석. 없으면 규칙 파서만 쓴다.
llm = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server"]
asyncio_mode = "auto"
